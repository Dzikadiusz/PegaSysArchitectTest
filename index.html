<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testing Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <!-- <h1>Testing Hub</h1> -->
    </header>

    

    <div class="content-wrapper">
      <aside class="panel sidebar">
        <div class="button-row">
          <button id="prevQBtn" disabled>&lt;</button>
          <button id="nextBtn" disabled>Random</button>
          <button id="nextQBtn" disabled>&gt;</button>
        </div>

        <div class="button-row">
          <button id="showAnswerBtn" disabled>Answers</button>
          <button id="validateBtn" disabled>Validate</button>
          <button id="resetScoreBtn" disabled>Reset score</button>

        </div>

        <div class="button-row">
          <button id="resetWeightsBtn" disabled>Reset Weights</button>
        </div>

        <div class="button-row">
            <button id="jumpToBtn" disabled>Go to</button>
          <input id="jumpToInput" type="number" min="1" placeholder="Question #" disabled />
          
        </div>

        <div class="range-head">
          <h2>Question Range</h2>
          <span id="rangeInfo" class="mono">N/A</span>
        </div>

        <div class="slider-group">
          <label for="startSlider">Start</label>
          <input id="startSlider" type="range" min="1" max="1" value="1" disabled />
          <span id="startValue" class="mono">1</span>
        </div>

        <div class="slider-group">
          <label for="endSlider">End</label>
          <input id="endSlider" type="range" min="1" max="1" value="1" disabled />
          <span id="endValue" class="mono">1</span>
        </div>
      </aside>

      <section class="panel question-panel">
        <div class="question-meta">
          <span id="questionCounter" class="mono">Question: -</span>
          <span class="weight-wrap">
            <span id="weightInfo" class="mono">Weight: -</span>
            <button id="easierBtn" class="weight-adjust-btn" disabled>&lt;</button>
            <button id="harderBtn" class="weight-adjust-btn" disabled>&gt;</button>
          </span>
          <span id="scoreInfo" class="mono">Score: 0 (0/0)</span>
        </div>


        <article>
          <h2>Question</h2>
          <p id="questionText" class="question-text">Upload a file to begin.</p>
        </article>

        <article id="answerBlock" class="answer-block hidden">
          <h3>Answer</h3>
          <p id="answerText"></p>
        </article>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
